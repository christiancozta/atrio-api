[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atrio-api"
version = "0.7.0"
description = "Plano de controle local do pipeline integral do ATRIO."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography==49.0.0",
    "fastapi==0.140.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "psycopg[binary]==3.3.4",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
evaluation = [
    "jsonschema==4.25.1",
]
test = [
    "jsonschema==4.25.1",
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]
