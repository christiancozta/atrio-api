name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/services/atrio_api/pyproject.toml

      - name: Install
        run: python -m pip install -e "packages/services/atrio_api[test]"

      - name: Test
        run: python -m pytest -q packages/services/atrio_api/tests

      - name: Verify normative manifest
        run: python tools/build_runtime_normative_manifest.py --check
